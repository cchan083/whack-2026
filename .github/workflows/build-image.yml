# Builds the Docker image (see Dockerfile) on every push to main and publishes it to
# GitHub's container registry:  ghcr.io/cchan083/whack-2026:latest
# Azure Container Apps runs that image; Azure for Students can't build images itself.
#
# One-time setup after the first run: GitHub -> your profile -> Packages -> whack-2026
#   -> Package settings -> Change visibility -> Public  (so Azure can pull it without a password).
# The image holds no secrets: .dockerignore leaves out .env.
name: Build Docker image

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read
  packages: write # publish to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
