# On every push to main: runs the tests and lint, then builds the Docker image
# (see Dockerfile), publishes it to
# GitHub's container registry (ghcr.io/cchan083/whack-2026), then deploys it to
# Azure Container Apps. Azure for Students can't build images itself.
#
# One-time setup:
#   1. GitHub -> your profile -> Packages -> whack-2026 -> Package settings
#      -> Change visibility -> Public  (so Azure can pull it without a password).
#   2. In Azure Cloud Shell, create a deploy login limited to the resource group:
#        az ad sp create-for-rbac --name gap-finder-deploy --role contributor \
#          --scopes $(az group show -n gap-finder-rg --query id -o tsv) --json-auth
#   3. GitHub -> Settings -> Secrets and variables -> Actions:
#        Secret    AZURE_CREDENTIALS     = the whole JSON printed by step 2
#        Variable  AZURE_RESOURCE_GROUP  = gap-finder-rg
#        Variable  AZURE_CONTAINER_APP   = gap-finder
# Until AZURE_CONTAINER_APP is set, only the build runs (the deploy is skipped).
# The image holds no secrets: .dockerignore leaves out .env.
name: Build and deploy to Azure

on:
  push:
    branches: [main]
  pull_request: # tests only: build and deploy are skipped for pull requests
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read
  packages: write # publish to ghcr.io

# One deploy at a time; a newer push replaces a waiting one.
concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  # Runs first: a failing test or lint error stops the build and deploy.
  test:
    runs-on: ubuntu-latest
    env:
      # db.py needs a URL at import, but the tests never connect to it.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest==8.4.2
      - run: pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.AZURE_CONTAINER_APP != ''
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Point the container app at the new image
        # The commit tag (not "latest") makes Azure start a new revision every time.
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "ghcr.io/${{ github.repository }}:${{ github.sha }}"
      - name: Check the new version answers
        run: |
          host=$(az containerapp show -n "${{ vars.AZURE_CONTAINER_APP }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            curl -fsS "https://$host/api/health" && exit 0
            sleep 10
          done
          echo "The app didn't answer /api/health within 5 minutes" && exit 1
