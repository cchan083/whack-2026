# Builds the React frontend and publishes it to GitHub Pages:
#   https://cchan083.github.io/whack-2026/
# The page calls the FastAPI backend hosted on Hugging Face (see
# deploy-huggingface.yml), so the backend must be deployed too.
#
# One-time setup:
#   1. GitHub -> Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   2. GitHub -> Settings -> Secrets and variables -> Actions -> Variables:
#        API_URL = the backend address, e.g. https://your-name-research-gap-finder.hf.space
# Until API_URL is set, this workflow is skipped (the site couldn't load any data).
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: # only rebuild when the frontend or this file changes
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write # publish to Pages
  id-token: write # prove to Pages that this workflow is allowed to publish

# Only one deployment at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          # Pages serves the site from /<repo name>/, so files must be loaded from there.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
